name: BroadMonetizationSandbox

options:
  minimumXcodeGenVersion: 2.45.4
  deploymentTarget:
    iOS: "17.0"

packages:
  BroadMonetization:
    path: ../..

settings:
  base:
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: 1
    CODE_SIGNING_ALLOWED: NO
    DEVELOPMENT_TEAM: ""

targets:
  BroadMonetizationSandbox:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: BroadMonetization
        product: BroadMonetization
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.broadapps.monetization.sandbox
        PRODUCT_NAME: BroadMonetizationSandbox
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_BroadAppsFixtureOnly: YES
        INFOPLIST_KEY_CFBundleDisplayName: Monetization Sandbox
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    scheme:
      gatherCoverageData: false
