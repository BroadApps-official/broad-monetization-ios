name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate SemVer tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be x.y.z."
            exit 1
          fi
      - name: Install ripgrep
        run: brew install ripgrep
      - name: Validate release metadata
        run: bash Scripts/check_release_version.sh "$GITHUB_REF_NAME"
      - name: Repeat full standalone module gate
        run: bash Scripts/module_gate.sh
      - name: Create GitHub Release with changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "BroadMonetization $GITHUB_REF_NAME" --notes-file CHANGELOG.md
