name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate SemVer tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be x.y.z."
            exit 1
          fi
      - name: Install ripgrep
        run: brew install ripgrep
      - name: Validate release metadata
        run: bash Scripts/check_release_version.sh "$GITHUB_REF_NAME"
      - name: Require tag commit on main
        run: |
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - name: Repeat full standalone module gate
        run: bash Scripts/module_gate.sh
      - name: Prepare version-specific release notes
        run: bash Scripts/extract_release_notes.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-notes.md"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "BroadMonetization $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
