<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title description">
  <title id="title">BroadApps iOS Platform</title>
  <desc id="description">Общая iOS-платформа из BroadCore, BroadMonetization, BroadUIFlows и независимого BroadExtensions, поверх которой собирается приложение и подключаются внешние сервисы.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071426"/><stop offset="0.52" stop-color="#111827"/><stop offset="1" stop-color="#2A102A"/></linearGradient>
    <filter id="shadow" x="-25%" y="-30%" width="150%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.34"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#94A3B8"/></marker>
  </defs>
  <rect width="1280" height="560" rx="36" fill="url(#background)"/>
  <circle cx="1166" cy="72" r="148" fill="#DB2777" opacity="0.18"/><circle cx="108" cy="520" r="174" fill="#2563EB" opacity="0.17"/>
  <text x="74" y="82" fill="#93C5FD" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19" font-weight="800" letter-spacing="4">BROADAPPS</text>
  <text x="74" y="149" fill="#F8FAFC" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="54" font-weight="800">iOS Platform</text>
  <text x="74" y="197" fill="#CBD5E1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="23">Запуск • монетизация • общие UI-флоу • extensions</text>
  <text x="74" y="231" fill="#94A3B8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17">Clean Architecture + MVVM + SOLID • iOS 17+ • Swift Package Manager</text>

  <path d="M260 341H301M536 341H576M836 341H876" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M418 298V272H968V286" fill="none" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M165 382V444H300" fill="none" stroke="#94A3B8" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <path d="M712 382C750 438 828 470 894 470" fill="none" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="74" y="300" width="186" height="82" rx="22" fill="#F59E0B"/><rect x="316" y="300" width="220" height="82" rx="22" fill="#EC4899"/><rect x="592" y="300" width="244" height="82" rx="22" fill="#10B981"/><rect x="892" y="300" width="188" height="82" rx="22" fill="#3B82F6"/><rect x="316" y="424" width="270" height="70" rx="20" fill="#8B5CF6"/><rect x="910" y="432" width="296" height="76" rx="20" fill="#64748B"/>
  </g>
  <text x="167" y="336" text-anchor="middle" fill="#422006" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="800">Приложение</text><text x="167" y="360" text-anchor="middle" fill="#713F12" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">сборка зависимостей</text>
  <text x="426" y="349" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="800">BroadUIFlows</text><text x="714" y="349" text-anchor="middle" fill="#052E16" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="800">BroadMonetization</text><text x="986" y="349" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="800">BroadCore</text>
  <text x="451" y="454" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="800">BroadExtensions</text><text x="451" y="478" text-anchor="middle" fill="#EDE9FE" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12">независимые helpers • по необходимости</text>
  <text x="1058" y="463" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="800">Внешние сервисы</text><text x="1058" y="488" text-anchor="middle" fill="#E2E8F0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12">Adapty • StoreKit • backend • RU</text>
</svg>
